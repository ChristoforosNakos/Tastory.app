<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tastory - Προσθήκη προϊόντος</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="auth-wrap">
    <div class="auth-card">
        <h2><i class="fas fa-utensils"></i> Προσθήκη προϊόντος</h2>

        <form th:action="@{/restaurants/{id}/products(id=${restaurantId})}"
              th:object="${productDto}" method="post">
            <label>Όνομα</label>
            <input type="text" th:field="*{name}" required>

            <label>Τιμή (€)</label>
            <input type="number" th:field="*{price}" step="0.01" min="0" required>

            <label>Περιγραφή</label>
            <textarea th:field="*{description}" rows="3"></textarea>

            <button type="submit" class="btn-block"><i class="fas fa-save"></i> Αποθήκευση</button>
        </form>

        <p class="auth-link"><a th:href="@{/restaurants/{id}/products(id=${restaurantId})}">← Πίσω στο μενού</a></p>
    </div>
</main>
</body>
</html>
