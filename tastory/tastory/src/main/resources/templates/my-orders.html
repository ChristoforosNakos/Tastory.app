<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Οι παραγγελίες μου</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="main-container">
    <h1>Οι παραγγελίες μου 📦</h1>

    <p th:if="${#lists.isEmpty(orders)}">Δεν έχεις κάνει καμία παραγγελία ακόμα.</p>

    <div class="card" th:each="order : ${orders}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <div>
                <strong>Παραγγελία #<span th:text="${order.id}"></span></strong> —
                <span th:text="${order.restaurant.name}"></span> —
                <span th:text="${#temporals.format(order.createdAt,'dd/MM/yyyy HH:mm')}"></span>
            </div>
            <span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(order.status)}"
                  th:text="${order.status}"></span>
        </div>
        <ul>
            <li th:each="item : ${order.items}">
                <span th:text="${item.product.name}"></span> ×
                <span th:text="${item.quantity}"></span> —
                <span th:text="${item.unitPrice}"></span>€
            </li>
        </ul>
        <div class="total">Σύνολο:
            <span th:text="${#numbers.formatDecimal(order.total,1,2)} + ' €'"></span></div>
    </div>
</main>
</body>
</html>
